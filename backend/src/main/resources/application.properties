spring.application.name=smart-courier-backend

# H2 file database (zero setup, runs anywhere). Switch to MySQL/Postgres by overriding spring.datasource.*.
spring.datasource.url=jdbc:h2:file:./data/smartcourier;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=${PORT:8080}

# CORS (comma-separated). Override for your deployed frontend origin.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# JWT
app.jwt.secret=${APP_JWT_SECRET:smart-courier-super-secret-key-change-me-in-production-0123456789}
app.jwt.ttl-hours=24

