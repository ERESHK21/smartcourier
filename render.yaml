services:
  - type: web
    name: smartcourier-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/login
    envVars:
      - key: PORT
        value: 8080
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://smartcourier.vercel.app
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70
      - key: APP_JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
